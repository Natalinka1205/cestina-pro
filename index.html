<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Čeština PRO — Interaktivní lekce</title>
<style>
:root{
  --ink:#17171b; --muted:#6d6d78; --pink:#ff4fa0; --line:#ececf2;
  --lav:#eee7ff; --blue:#e4f3ff; --yellow:#fff3c9; --peach:#ffe6d6;
  --mint:#e8f7ef; --gray:#f5f5f8; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fafafd;color:var(--ink)}
.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}
header{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 12px 35px rgba(20,20,30,.06)}
.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-size:clamp(30px,6vw,54px);font-weight:900;letter-spacing:-2px;margin:0}
.brand span{color:var(--pink);text-shadow:0 0 18px rgba(255,79,160,.22)}
.sub{color:var(--muted);font-size:16px;margin:8px 0 0}
.raccoon{font-size:48px;background:var(--gray);border-radius:20px;padding:10px 14px}
.controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin:24px 0 16px}
input{width:100%;border:1px solid var(--line);border-radius:16px;padding:15px 17px;font-size:16px;background:#fff;outline:none}
input:focus{border-color:#c9c9d5;box-shadow:0 0 0 4px #f0efff}
.filters{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}
button.active{background:#17171b;color:#fff;border-color:#17171b}
h2{margin:28px 2px 14px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{display:flex;min-height:170px;flex-direction:column;justify-content:space-between;padding:20px;border-radius:23px;text-decoration:none;color:var(--ink);border:1px solid rgba(0,0,0,.04);transition:.18s transform,.18s box-shadow}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(20,20,30,.08)}
.card h3{margin:0;font-size:23px}.card p{margin:8px 0;color:#555562;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;font-weight:800;background:rgba(255,255,255,.7);padding:6px 9px;border-radius:999px}
.open{font-weight:900;margin-top:18px}
.c1{background:var(--blue)}.c2{background:var(--lav)}.c3{background:var(--yellow)}.c4{background:var(--peach)}.c5{background:var(--mint)}
.empty{display:none;padding:35px;text-align:center;color:var(--muted);background:#fff;border-radius:20px;border:1px solid var(--line)}
footer{text-align:center;color:#8a8a94;font-size:13px;margin-top:34px}
@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:14px 12px 40px}header{padding:21px}.raccoon{font-size:38px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div>
      <h1 class="brand">Čeština <span>PRO</span></h1>
      <p class="sub">Interaktivní lekce češtiny • děti i dospělí • A0–B1</p>
    </div>
    <div class="raccoon" aria-label="maskot">🦝</div>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Hledat lekci…">
  </div>
  <div class="filters">
    <button class="active" data-filter="all">Vše</button>
    <button data-filter="deti">Děti</button>
    <button data-filter="dospeli">Dospělí</button>
    <button data-filter="a0">A0</button>
    <button data-filter="a1">A1</button>
    <button data-filter="a2">A2</button>
    <button data-filter="b1">B1</button>
  </div>
</header>

<h2>Lekce</h2>
<main class="grid" id="lessons">
  <a class="card c1" href="cislovky.html" data-tags="deti dospeli a0 a1 číslovky cisla numbers">
    <div><h3>Číslovky</h3><p>Čísla, otázky a praktické procvičování.</p></div>
    <div><div class="tags"><span class="tag">A0–A1</span><span class="tag">Děti / Dospělí</span></div><div class="open">Otevřít lekci →</div></div>
  </a>

  <!-- NOVÁ LEKCE:
  Zkopíruj celý blok <a class="card ...">...</a>, změň href, název, popis a data-tags.
  Např. href="pocasi.html" a název Počasí.
  -->
</main>
<div class="empty" id="empty">Žádná lekce nebyla nalezena.</div>

<footer>Kirichenko Nataliia (2026) • @cestina_pro_ua</footer>
</div>

<script>
const cards=[...document.querySelectorAll('.card')];
const buttons=[...document.querySelectorAll('[data-filter]')];
const search=document.getElementById('search');
const empty=document.getElementById('empty');
let filter='all';

function apply(){
  const q=search.value.trim().toLowerCase();
  let shown=0;
  cards.forEach(card=>{
    const hay=(card.textContent+' '+card.dataset.tags).toLowerCase();
    const okFilter=filter==='all'||card.dataset.tags.split(' ').includes(filter);
    const okSearch=!q||hay.includes(q);
    card.style.display=(okFilter&&okSearch)?'flex':'none';
    if(okFilter&&okSearch) shown++;
  });
  empty.style.display=shown?'none':'block';
}
buttons.forEach(btn=>btn.addEventListener('click',()=>{
  buttons.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); filter=btn.dataset.filter; apply();
}));
search.addEventListener('input',apply);
</script>
</body>
</html>
